<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR | James Fehlberg EOI</title><style>*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#f4f1e8;color:#152421;min-height:100vh;display:grid;place-items:center;padding:24px}.wrap{width:min(820px,100%);display:grid;grid-template-columns:1fr 280px;gap:20px}.card{background:#fff;border:1px solid #d9ddd8;border-radius:22px;padding:28px}h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1;margin:.2em 0}.small{font-size:.8rem;color:#64736e}input{width:100%;padding:14px;border:1px solid #cbd2cf;border-radius:12px;font-size:1rem}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,a{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid #cbd2cf;background:#fff;color:#152421;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;cursor:pointer}.primary{background:#143b34;color:#fff;border-color:#143b34}#qr{height:230px;display:grid;place-items:center;border:1px dashed #cbd2cf;border-radius:16px;background:#fff}#qr canvas{max-width:210px!important;max-height:210px!important}@media(max-width:700px){.wrap{grid-template-columns:1fr}.preview{order:-1}}</style></head><body><main class="wrap"><section class="card"><p class="small">JAMES FEHLBERG · YEAR 7 YLC</p><h1>Generate the print QR.</h1><p>Deploy the site, paste its final HTTPS URL, generate the QR and scan-test it before adding it to the printed EOI.</p><input id="url" type="url" placeholder="https://username.github.io/repository/"><div class="actions"><button class="primary" id="gen">Generate</button><button id="dl" disabled>Download PNG</button><a href="index.html">Back</a></div><p class="small" id="status">No tracking is added to the QR.</p></section><section class="card preview"><div id="qr">QR preview</div></section></main><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script>const i=document.getElementById('url'),q=document.getElementById('qr'),s=document.getElementById('status'),d=document.getElementById('dl');if(location.protocol.startsWith('http'))i.value=new URL('./',location.href).href;async function go(){const v=i.value.trim();if(!/^https:\/\//i.test(v)){s.textContent='Enter a full HTTPS URL.';return}q.innerHTML='';const c=document.createElement('canvas');q.appendChild(c);await QRCode.toCanvas(c,v,{width:210,margin:2,errorCorrectionLevel:'H',color:{dark:'#143b34',light:'#ffffff'}});d.disabled=false;s.textContent='Ready. Scan-test before printing.'}document.getElementById('gen').onclick=go;d.onclick=()=>{const c=q.querySelector('canvas');if(!c)return;const a=document.createElement('a');a.download='James-Fehlberg-Y7-YLC-QR.png';a.href=c.toDataURL();a.click()};if(i.value)go();</script></body></html>
